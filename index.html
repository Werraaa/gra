<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gra 2048 - Zagadka Dnia</title>
    <style>
        :root {
            --grid-size: 4;
            --cell-size: 80px;
            --cell-gap: 10px;
        }

        body {
            background-color: #faf8ef;
            color: #776e65;
            font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
            overflow: hidden;
        }

        .heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: calc(var(--cell-size) * var(--grid-size) + var(--cell-gap) * (var(--grid-size) + 1));
            max-width: 100%;
            box-sizing: border-box;
            padding: 0 10px;
        }

        h1 {
            font-size: 48px;
            font-weight: bold;
            margin: 0;
        }

        .score-container {
            background: #bbada0;
            padding: 5px 20px;
            font-size: 25px;
            font-weight: bold;
            color: white;
            border-radius: 3px;
            text-align: center;
        }

        .score-title {
            font-size: 13px;
            color: #eee4da;
            text-transform: uppercase;
            display: block;
        }

        .game-container {
            position: relative;
            padding: var(--cell-gap);
            background: #bbada0;
            border-radius: 6px;
            width: calc(var(--cell-size) * var(--grid-size) + var(--cell-gap) * (var(--grid-size) - 1));
            height: calc(var(--cell-size) * var(--grid-size) + var(--cell-gap) * (var(--grid-size) - 1));
            box-sizing: content-box;
            touch-action: none;
        }

        .grid-container {
            position: absolute;
            z-index: 1;
            display: grid;
            grid-template-columns: repeat(var(--grid-size), var(--cell-size));
            grid-template-rows: repeat(var(--grid-size), var(--cell-size));
            gap: var(--cell-gap);
        }

        .grid-cell {
            width: var(--cell-size);
            height: var(--cell-size);
            border-radius: 3px;
            background: rgba(238, 228, 218, 0.35);
        }

        .tile-container {
            position: absolute;
            z-index: 2;
            width: 100%;
            height: 100%;
        }

        .tile {
            position: absolute;
            width: var(--cell-size);
            height: var(--cell-size);
            border-radius: 3px;
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 32px;
            color: #fff;
            text-shadow: 0px 2px 5px rgba(0,0,0,0.9), 0px 0px 10px rgba(0,0,0,0.5);
            /* Płynne przejście transformacji pozycji (sliding) oraz skali (pojawianie się) */
            transition: transform 150ms ease-in-out;
        }

        .game-message {
            display: none;
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background: rgba(238, 228, 218, 0.73);
            z-index: 10;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: fadeIn 800ms ease-in-out both;
        }

        .game-message p {
            font-size: 60px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .retry-button {
            background: #8f7a66;
            border-radius: 3px;
            padding: 0 20px;
            text-decoration: none;
            color: #f9f6f2;
            height: 40px;
            line-height: 40px;
            cursor: pointer;
            font-weight: bold;
            border: none;
            font-size: 18px;
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        @media (max-width: 450px) {
            :root {
                --cell-size: 70px;
                --cell-gap: 7px;
            }
            h1 { font-size: 36px; }
            .tile { font-size: 26px; }
        }
    </style>
</head>
<body>

    <div class="heading">
        <h1>2048</h1>
        <div class="score-container">
            <span class="score-title">Wynik</span>
            <span id="score">0</span>
        </div>
    </div>

    <div class="game-container" id="game-container">
        <div class="game-message" id="game-message">
            <p id="game-over-text">Koniec Gry!</p>
            <button class="retry-button" onclick="resetGame()">Zagraj ponownie</button>
        </div>

        <div class="grid-container" id="grid-container"></div>
        <div class="tile-container" id="tile-container"></div>
    </div>

    <script>
        const GRID_SIZE = 4;
        
        const gridContainer = document.getElementById('grid-container');
        const tileContainer = document.getElementById('tile-container');
        const scoreDisplay = document.getElementById('score');
        const gameMessage = document.getElementById('game-message');

        // Zmiana ścieżki: zdjęcia są w tym samym folderze co plik HTML
        const githubImgBaseUrl = "./";

        let board = [];
        let score = 0;
        // Obiekt przechowujący fizyczne kafelki DOM powiązane z unikalnymi ID kafelków logicznych
        let tileElements = {}; 
        let tileIdCounter = 0;

        function createGridBackground() {
            gridContainer.innerHTML = '';
            for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
                const cell = document.createElement('div');
                cell.classList.add('grid-cell');
                gridContainer.appendChild(cell);
            }
        }

        function initGame() {
            createGridBackground();
            tileContainer.innerHTML = '';
            tileElements = {};
            tileIdCounter = 0;
            
            // Plansza przechowuje obiekty kafelków: { value, id } zamiast samych liczb
            board = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));
            score = 0;
            scoreDisplay.innerText = score;
            gameMessage.style.display = 'none';
            
            addRandomTile();
            addRandomTile();
            drawTiles();
        }

        function addRandomTile() {
            let emptyCells = [];
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (board[r][c] === null) {
                        emptyCells.push({ r, c });
                    }
                }
            }
            if (emptyCells.length > 0) {
                let { r, c } = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                let val = Math.random() < 0.9 ? 2 : 4;
                board[r][c] = {
                    value: val,
                    id: tileIdCounter++
                };
            }
        }

        function getLayoutStyles() {
            const currentCellSize = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cell-size'));
            const currentCellGap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cell-gap'));
            return { currentCellSize, currentCellGap };
        }

        function drawTiles() {
            const { currentCellSize, currentCellGap } = getLayoutStyles();
            let currentIds = new Set();

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    let tileData = board[r][c];
                    if (tileData !== null) {
                        currentIds.add(tileData.id);
                        
                        let topPosition = r * (currentCellSize + currentCellGap);
                        let leftPosition = c * (currentCellSize + currentCellGap);
                        
                        // Jeśli kafelka nie ma jeszcze na ekranie, stwórz go
                        if (!tileElements[tileData.id]) {
                            const tile = document.createElement('div');
                            tile.classList.add('tile');
                            tile.innerText = tileData.value;
                            tile.style.backgroundImage = `url('${githubImgBaseUrl}${tileData.value}.jpg')`;
                            
                            // Animacja popIn dla nowo zrodzonego kafelka
                            tile.style.animation = "popIn 200ms ease-in-out";
                            
                            tileContainer.appendChild(tile);
                            tileElements[tileData.id] = tile;
                        } else {
                            // Jeśli kafelek istnieje, zaktualizuj jego wartość/obrazek (np. po połączeniu)
                            tileElements[tileData.id].innerText = tileData.value;
                            tileElements[tileData.id].style.backgroundImage = `url('${githubImgBaseUrl}${tileData.value}.jpg')`;
                        }
                        
                        // Zamiast zmieniać style top/left, używamy transform translate dla płynności animacji
                        tileElements[tileData.id].style.transform = `translate(${leftPosition}px, ${topPosition}px)`;
                    }
                }
            }

            // Usuń z widoku kafelki, które zniknęły w wyniku łączenia
            for (let id in tileElements) {
                if (!currentIds.has(parseInt(id))) {
                    tileElements[id].remove();
                    delete tileElements[id];
                }
            }
        }

        function slide(row) {
            let arr = row.filter(val => val !== null);
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i].value === arr[i + 1].value) {
                    arr[i].value *= 2;
                    score += arr[i].value;
                    arr[i + 1] = null;
                }
            }
            arr = arr.filter(val => val !== null);
            while (arr.length < GRID_SIZE) {
                arr.push(null);
            }
            return arr;
        }

        function rotateBoardClockwise() {
            let nextBoard = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    nextBoard[c][GRID_SIZE - 1 - r] = board[r][c];
                }
            }
            board = nextBoard;
        }

        function move(direction) {
            // Do porównania zmian tworzymy uproszczony stan (same wartości kafelków)
            let oldState = JSON.stringify(board.map(row => row.map(cell => cell ? cell.value : 0)));
            let rotations = 0;
            
            if (direction === 'Down') rotations = 1;
            if (direction === 'Right') rotations = 2;
            if (direction === 'Up') rotations = 3;

            for (let i = 0; i < rotations; i++) rotateBoardClockwise();

            for (let r = 0; r < GRID_SIZE; r++) {
                board[r] = slide(board[r]);
            }

            let returnRotations = (4 - rotations) % 4;
            for (let i = 0; i < returnRotations; i++) rotateBoardClockwise();

            let newState = JSON.stringify(board.map(row => row.map(cell => cell ? cell.value : 0)));

            if (oldState !== newState) {
                addRandomTile();
                scoreDisplay.innerText = score;
                drawTiles();
                if (isGameOver()) {
                    gameMessage.style.display = 'flex';
                }
            }
        }

        function isGameOver() {
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (board[r][c] === null) return false;
                    if (r < GRID_SIZE - 1 && board[r][c].value === board[r + 1][c].value) return false;
                    if (c < GRID_SIZE - 1 && board[r][c].value === board[r][c + 1].value) return false;
                }
            }
            return true;
        }

        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
            }
            switch (e.key) {
                case 'ArrowLeft':  move('Left');  break;
                case 'ArrowRight': move('Right'); break;
                case 'ArrowUp':    move('Up');    break;
                case 'ArrowDown':  move('Down');  break;
            }
        });

        let touchStartX = 0;
        let touchStartY = 0;
        const gameContainer = document.getElementById('game-container');

        gameContainer.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        gameContainer.addEventListener('touchend', (e) => {
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            
            let diffX = touchEndX - touchStartX;
            let diffY = touchEndY - touchStartY;
            const threshold = 30; 

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (Math.abs(diffX) > threshold) {
                    if (diffX > 0) move('Right');
                    else move('Left');
                }
            } else {
                if (Math.abs(diffY) > threshold) {
                    if (diffY > 0) move('Down');
                    else move('Up');
                }
            }
        }, { passive: true });

        function resetGame() {
            initGame();
        }

        window.addEventListener('resize', drawTiles);
        initGame();
    </script>
</body>
</html>
